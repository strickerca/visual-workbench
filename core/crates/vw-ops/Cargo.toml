[package]
name = "vw-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
