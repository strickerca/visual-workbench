[package]
name = "vw-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "vw_core"
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]
integration-carrier-fault = ["vw-remote-host/integration-carrier-fault"]
fixtures = ["tokio/rt", "tokio/macros"]

[dependencies]
uniffi.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "net", "time", "macros"] }
thiserror.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
vw-ai = { version = "=0.1.0", path = "../vw-ai" }
vw-ai-provider = { version = "=0.1.0", path = "../vw-ai-provider" }
vw-ai-platform = { version = "=0.1.0", path = "../vw-ai-platform" }
tempfile.workspace = true
zeroize.workspace = true
blake3 = { workspace = true, features = ["std", "pure"] }
vw-net = { version = "=0.1.0", path = "../vw-net" }
vw-remote = { version = "=0.1.0", path = "../vw-remote" }
vw-model = { version = "=0.1.0", path = "../vw-model" }
vw-geom = { version = "=0.1.0", path = "../vw-geom" }
vw-proto = { version = "=0.1.0", path = "../vw-proto" }
vw-ops = { version = "=0.1.0", path = "../vw-ops" }
vw-store = { version = "=0.1.0", path = "../vw-store" }
vw-ink = { version = "=0.1.0", path = "../vw-ink" }
vw-raster = { version = "=0.1.0", path = "../vw-raster" }
vw-formats = { version = "=0.1.0", path = "../vw-formats" }
vw-assets = { version = "=0.1.0", path = "../vw-assets" }
vw-stream = { version = "=0.1.0", path = "../vw-stream" }
vw-capture = { version = "=0.1.0", path = "../vw-capture" }
vw-avif-os = { version = "=0.1.0", path = "../vw-avif-os" }
vw-package = { version = "=0.1.0", path = "../vw-package" }
vw-codec-os = { version = "=0.1.0", path = "../vw-codec-os" }
vw-instructions = { version = "=0.1.0", path = "../vw-instructions" }
vw-semantics = { version = "=0.1.0", path = "../vw-semantics" }
vw-mask = { version = "=0.1.0", path = "../vw-mask" }
vw-document-protocol = { version = "=0.1.0", path = "../vw-document-protocol" }
vw-document-win = { version = "=0.1.0", path = "../../../host-win/crates/vw-document-win" }
vw-pdf = { version = "=0.1.0", path = "../vw-pdf" }
tiny-skia = { workspace = true, features = ["std"] }
sha2.workspace = true
png.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
vw-assets-win = { version = "=0.1.0", path = "../../../host-win/crates/vw-assets-win" }
vw-remote-host = { version = "=0.1.0", path = "../../../host-win/crates/vw-remote-host" }
vw-host-win = { version = "=0.1.0", path = "../../../host-win/crates/vw-host-win" }
vw-net = { version = "=0.1.0", path = "../vw-net", features = ["mdns"] }

[target.'cfg(target_os = "android")'.dependencies]
vw-svg = { version = "=0.1.0", path = "../vw-svg" }
pdfium-render = { workspace = true, features = ["pdfium_7881"] }
jni.workspace = true

[dev-dependencies]
vw-svg = { version = "=0.1.0", path = "../vw-svg" }
pdfium-render = { workspace = true, features = ["pdfium_7881"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "edits"
harness = false

[[bin]]
name = "vw-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "vw-ffi-golden"
path = "src/bin/ffi-golden.rs"
required-features = ["fixtures"]
