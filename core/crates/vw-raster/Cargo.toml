[package]
name = "vw-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
vw-ink = { path = "../vw-ink", version = "=0.1.0" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
png = "=0.18.1"
moxcms = "=0.8.1"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
libwebp-sys = { version = "=0.14.4", default-features = false }
libm = { version = "=0.2.16", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"

[lints]
workspace = true
