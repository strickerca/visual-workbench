[package]
name = "vw-host-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
vw-net = { path = "../../../core/crates/vw-net", version = "=0.1.0" }
vw-model = { path = "../../../core/crates/vw-model", version = "=0.1.0" }
vw-store = { path = "../../../core/crates/vw-store", version = "=0.1.0" }
zeroize.workspace = true
tempfile.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
