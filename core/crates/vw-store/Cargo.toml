[package]
name = "vw-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-ops = { path = "../vw-ops", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
rusqlite = { workspace = true, features = ["bundled", "hooks"] }
zip = { version = "=9.5.1", default-features = false }
tempfile.workspace = true
blake3 = { workspace = true, features = ["std", "pure"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
vw-ops = { path = "../vw-ops", version = "=0.1.0", features = ["cross-check"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
