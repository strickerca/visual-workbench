  '''^\s*"apps/shared/src/androidMain/kotlin/com/visualworkbench/shared/AndroidProviderKeyStore\.kt": "1f8764841dfaa87ec8c55aa65d50f81aa5e8974f76b9c94a70b755306b8e727d",?\s*$''',
  '''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/AgentCaptureApi\.kt": "3948a8a6708e0a066992569fdb51f9f9ccb1cccf16f499782bf8963fdbcce16a",?\s*$''',
