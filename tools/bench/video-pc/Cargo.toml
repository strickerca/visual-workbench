[package]
name = "vw-video-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "qoi"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation",
    "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Ole",
    "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[bin]]
name = "video-pc"
path = "src/main.rs"
