[package]
name = "vw-ai-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-ai = { path = "../vw-ai", version = "=0.1.0" }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.23.1"
png = "=0.18.1"
tempfile = "=3.27.0"
vw-mask = { path = "../vw-mask", version = "=0.1.0" }
vw-model = { path = "../vw-model", version = "=0.1.0" }
