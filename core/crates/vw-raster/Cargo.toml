[package]
name = "vw-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false

[dependencies]
vw-geom = { path = "../vw-geom", version = "=0.1.0" }
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
vw-ink = { path = "../vw-ink", version = "=0.1.0" }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
png.workspace = true
moxcms.workspace = true
tiny-skia = { workspace = true, features = ["std"] }
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
libwebp-sys = { version = "=0.14.4", default-features = false }
libm.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[lints]
workspace = true
