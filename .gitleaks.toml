[[rules]]
id = "vw-evidence-ip-address"
description = "Network addresses must be removed from evidence"
path = '''(^|/)docs/evidence/'''
regex = '''\b(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}\b'''

[[rules]]
id = "vw-evidence-mac-address"
description = "Hardware addresses must be removed from evidence"
path = '''(^|/)docs/evidence/'''
regex = '''\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'''

[[rules]]
id = "vw-evidence-device-serial"
description = "An adb listing must never expose a hardware device serial"
path = '''(^|/)docs/evidence/'''
regex = '''(?m)^\s*[A-Za-z0-9_-]{6,}\s+(?:device|unauthorized|offline)(?:\s|$)'''

[[rules]]
id = "vw-evidence-user-profile"
description = "User profile names must be removed from retained evidence"
path = '''(^|/)docs/evidence/'''
regex = '''(?:[A-Za-z]:[\\/]Users[\\/]|/(?:home|Users)/)[A-Za-z0-9._-]+'''

[[rules.allowlists]]
description = "Only explicit redacted or synthetic user placeholders are allowed"
regexTarget = "match"
regexes = ['''(?i)(?:[\\/])(?:redacted|synthetic-user|example-user)$''']

[[rules]]
id = "vw-mcp-token"
description = "Reserved token rule; the final format is defined in T2.09"
regex = '''\bvw_mcp_[A-Za-z0-9_-]{32,}\b'''

