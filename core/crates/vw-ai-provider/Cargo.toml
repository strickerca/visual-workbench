[package]
name = "vw-ai-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-ai = { path = "../vw-ai", version = "=0.1.0" }
bytes.workspace = true
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { workspace = true, features = ["std", "ring"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
png.workspace = true
tempfile.workspace = true
vw-mask = { path = "../vw-mask", version = "=0.1.0" }
vw-model = { path = "../vw-model", version = "=0.1.0" }
