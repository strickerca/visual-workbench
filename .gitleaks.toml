title = "Visual Workbench secrets and evidence identifiers"

[extend]
useDefault = true

[[allowlists]]
description = "Generated build output and preserved input packages are not source"
paths = ['''(^|/)(target|build|build-hil|\.gradle|\.kotlin|\.local|\.git|fixtures-private|generated)/''']

[[allowlists]]
description = "Exact source SHA-256 entries whose Kotlin filenames contain Api; reviewed Phase 1 binding receipts"
condition = "AND"
paths = ['''(^|/)docs/evidence/T1\.(07|08|10)[A-Za-z0-9.-]*\.json$''']
regexTarget = "line"
regexes = ['''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/(CoreApi|SessionApi|StreamingApi)\.kt": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Exact Phase 2 source hash pairs independently matched to their files; no general hash or key exemption"
condition = "AND"
paths = ['''(^|/)docs/evidence/T2\.11-app-tests\.json$''']
regexTarget = "line"
regexes = [
  '''^\s*"apps/android/src/main/kotlin/com/visualworkbench/android/editor/ProviderKeyDialog\.kt": "82b29061104563401d046b95105a2c0b4d4dc300cc78726ecb0a9c379cd776bd",?\s*$''',
