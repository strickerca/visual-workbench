[package]
name = "vw-host-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "vw_host"
crate-type = ["cdylib", "rlib"]

[dependencies]
vw-capture = { version = "=0.1.0", path = "../../../core/crates/vw-capture" }
uniffi.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
vw-raster = { version = "=0.1.0", path = "../../../core/crates/vw-raster" }
vw-model = { version = "=0.1.0", path = "../../../core/crates/vw-model" }
png.workspace = true
blake3 = { workspace = true, features = ["std", "pure"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "ApplicationModel", "Management_Deployment", "Foundation", "Win32_System_WinRT"
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
moxcms.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
