[package]
name = "vw-mcp-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-VisualWorkbench-Proprietary"
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
vw-package = { version = "=0.1.0", path = "../../core/crates/vw-package" }
getrandom.workspace = true
zeroize.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true
png.workspace = true
vw-model = { version = "=0.1.0", path = "../../core/crates/vw-model" }
vw-proto = { version = "=0.1.0", path = "../../core/crates/vw-proto" }
vw-ops = { version = "=0.1.0", path = "../../core/crates/vw-ops" }
vw-instructions = { version = "=0.1.0", path = "../../core/crates/vw-instructions" }

[[bin]]
name = "vw-mcp-package"
path = "src/bin/package.rs"
[[bin]]
name = "vw-mcp"
path = "src/bin/bridge.rs"
[[bin]]
name = "vw-mcp-host"
path = "src/bin/host.rs"

[[bin]]
name = "vw-codex-host"
path = "src/bin/codex.rs"
