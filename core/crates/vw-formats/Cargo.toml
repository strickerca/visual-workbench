[package]
name = "vw-formats"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-VisualWorkbench-Proprietary"
publish = false

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-raster = { path = "../vw-raster", version = "=0.1.0" }
image = { version = "=0.25.10", default-features = false, features = ["bmp"] }
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "jpeg", "lzw"] }
weezl = "=0.1.10"
thiserror = "=2.0.21"

[lints]
workspace = true
