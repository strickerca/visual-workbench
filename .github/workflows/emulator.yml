# Runs the on-screen Android tests (the kind that catch a black canvas) on a
# headless emulator. Informational: it is not part of ci-required, because an
# emulator has no pen and a software screen. It is not a device result.
name: emulator

on:
  push:
    paths:
      - "apps/**"
      - "core/**"
      - "tools/ci/**"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: kotlin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'apps/**/*.lockfile', 'apps/gradle/wrapper/gradle-wrapper.properties') }}
      - run: rustup show active-toolchain || rustup toolchain install
      - run: tools/ci/install-tools.sh ndk android
      - run: tools/ci/android-emulator.sh
