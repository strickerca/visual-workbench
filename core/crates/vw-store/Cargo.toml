[package]
name = "vw-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-ops = { path = "../vw-ops", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
zip = { version = "=8.6.0", default-features = false }
fs2 = "=0.4.3"
tempfile = "=3.27.0"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
