[package]
name = "vw-vdd-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO",
    "Win32_System_Com", "Win32_UI_HiDpi",
] }

[lints]
workspace = true

[[bin]]
name = "vdd-probe"
path = "src/main.rs"
