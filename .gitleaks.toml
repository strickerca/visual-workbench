  '''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/CaptureDeliveryApi\.kt": "6ccba25754dc12462dcb365d0ebbd6833392871d0a5f7ee590c722d45d25e4ca",?\s*$''',
  '''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/CaptureImportsApi\.kt": "0f3f1ef0f065530734110c715d09b67c37f368551271bc822196041dacb087b0",?\s*$''',
  '''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/CoreApi\.kt": "d5e9c2b251c4b8dddf8f8f23f9ba7e08f9e9052312ca44fc269fecb408c2ff7f",?\s*$''',
  '''^\s*"apps/shared/src/commonMain/kotlin/com/visualworkbench/shared/EraserApi\.kt": "f686a510ec0186e4a9ca75c091557ddb6cfc9688780ec0459b2ebde8c79f5ef6",?\s*$''',
