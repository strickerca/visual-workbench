[package]
name = "vw-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
vw-instructions = { path = "../vw-instructions", version = "=0.1.0" }
vw-semantics = { path = "../vw-semantics", version = "=0.1.0" }
vw-raster = { path = "../vw-raster", version = "=0.1.0" }
png = "=0.18.1"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"

[dev-dependencies]
vw-ops = { path = "../vw-ops", version = "=0.1.0" }

