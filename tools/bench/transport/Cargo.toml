[package]
name = "vw-transport-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
quinn = { workspace = true, features = ["runtime-tokio", "rustls-ring"] }
rustls = { workspace = true, features = ["std", "ring"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[[bin]]
name = "transport-bench"
path = "src/main.rs"
