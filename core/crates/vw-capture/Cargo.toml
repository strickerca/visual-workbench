[package]
name = "vw-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-VisualWorkbench-Proprietary"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
png = "=0.18.1"
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
ring = "=0.17.14"
vw-model = { path = "../vw-model", version = "=0.1.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading",
    "Win32_System_Performance", "Win32_System_WinRT", "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11", "Win32_UI_Accessibility", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects"
] }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "vw-capture-helper"
path = "src/bin/helper.rs"
