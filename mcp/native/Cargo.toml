[package]
name = "vw-mcp-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-VisualWorkbench-Proprietary"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
vw-package = { version = "=0.1.0", path = "../../core/crates/vw-package" }
getrandom = "=0.4.3"
zeroize = "=1.9.0"
fs2 = "=0.4.3"
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "=3.27.0"
png = "=0.18.1"
vw-model = { version = "=0.1.0", path = "../../core/crates/vw-model" }
vw-proto = { version = "=0.1.0", path = "../../core/crates/vw-proto" }
vw-ops = { version = "=0.1.0", path = "../../core/crates/vw-ops" }
vw-instructions = { version = "=0.1.0", path = "../../core/crates/vw-instructions" }

[[bin]]
name = "vw-mcp-package"
path = "src/bin/package.rs"
[[bin]]
name = "vw-mcp"
path = "src/bin/bridge.rs"
[[bin]]
name = "vw-mcp-host"
path = "src/bin/host.rs"

[[bin]]
name = "vw-codex-host"
path = "src/bin/codex.rs"
