[package]
name = "vw-ai-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "=0.23.1"
fs2 = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
moxcms = "=0.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Networking_WinHttp"] }

[[bin]]
name = "ai-spike"
path = "src/main.rs"
# CLI behavior is covered by integration/mocks, not an empty Android test executable.
test = false
bench = false
