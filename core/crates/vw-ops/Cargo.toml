[package]
name = "vw-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
test = false

[features]
# Recompute every incrementally maintained result (state hash, changed-object
# validation, undo cursor) from the whole project and stop on any difference.
# Test builds turn it on through dev-dependencies; applications never do.
cross-check = []

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
