[graph]
all-features = true
# Product targets and the Linux host-test target in BUILD_SPECIFICATION 3.1.
# Add any new shipping/test platform here before enabling its builds. No crate,
# development dependency, or license exception is excluded on these targets.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# Known vulnerabilities and unsound code fail this check. The entries below have
# no fixed release yet; each says why it is tolerated and what removes it.
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained; build-time only, through the UniFFI bindings generator's templates" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained; SVG text shaping through usvg 0.47, re-evaluate with the next resvg upgrade" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; SVG font parsing through usvg 0.47, re-evaluate with the next resvg upgrade" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
  "CC0-1.0", "MPL-2.0", "BSL-1.0", "OFL-1.1",
  # Owner decision 2026-11-04 (LIC-003): permissive notices embedded in the skiko Skia DLL.
  "MIT-Modern-Variant", "IJG", "libpng-2.0",
]

[licenses.private]
ignore = true

# Any dependency license outside the allow list fails. Driver packages and
# replaceable Windows-only LGPL binaries require a separately reviewed exception;
# no such exceptions are present in this starter workspace.
[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
