[package]
name = "vw-package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-geom = { path = "../vw-geom", version = "=0.1.0" }
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
vw-instructions = { path = "../vw-instructions", version = "=0.1.0" }
vw-semantics = { path = "../vw-semantics", version = "=0.1.0" }
vw-raster = { path = "../vw-raster", version = "=0.1.0" }
png.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
vw-ops = { path = "../vw-ops", version = "=0.1.0" }

