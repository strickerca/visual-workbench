[package]
name = "vw-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
libm.workspace = true
moxcms.workspace = true
png.workspace = true
rusqlite = { workspace = true, features = ["bundled", "limits"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
vw-mask = { version = "=0.1.0", path = "../vw-mask" }
vw-model = { version = "=0.1.0", path = "../vw-model" }
vw-raster = { version = "=0.1.0", path = "../vw-raster" }

[dev-dependencies]
tempfile.workspace = true
proptest = { workspace = true, features = ["std"] }
