[package]
name = "vw-diag-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "diag-win"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_Media_MediaFoundation", "Win32_System_Com",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps",
] }
