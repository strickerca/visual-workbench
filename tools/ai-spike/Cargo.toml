[package]
name = "vw-ai-spike"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
moxcms.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Networking_WinHttp"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[[bin]]
name = "ai-spike"
path = "src/main.rs"
# CLI behavior is covered by integration/mocks, not an empty Android test executable.
test = false
bench = false
