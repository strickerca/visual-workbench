[package]
name = "vw-pair-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-net = { path = "../../core/crates/vw-net", version = "=0.1.0" }
vw-model = { path = "../../core/crates/vw-model", version = "=0.1.0" }
vw-ops = { path = "../../core/crates/vw-ops", version = "=0.1.0" }
vw-proto = { path = "../../core/crates/vw-proto", version = "=0.1.0" }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
zeroize.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
vw-host-win = { path = "../../host-win/crates/vw-host-win", version = "=0.1.0" }

[[bin]]
name = "pair-cli"
path = "src/main.rs"
