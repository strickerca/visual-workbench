[package]
name = "vw-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
test-support = []
mdns = ["dep:mdns-sd"]

[dependencies]
vw-model = { path = "../vw-model", version = "=0.1.0" }
vw-ops = { path = "../vw-ops", version = "=0.1.0" }
vw-proto = { path = "../vw-proto", version = "=0.1.0" }
vw-store = { path = "../vw-store", version = "=0.1.0" }
quinn = { workspace = true, features = ["runtime-tokio", "rustls-ring"] }
rustls = { workspace = true, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros", "sync"] }
bytes.workspace = true
blake3 = { workspace = true, features = ["std", "pure"] }
thiserror.workspace = true
ring.workspace = true
zeroize.workspace = true
spake2 = "=0.4.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rcgen = { workspace = true, features = ["crypto", "ring"] }
mdns-sd = { version = "=0.21.3", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true
