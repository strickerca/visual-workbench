[workspace]
resolver = "3"
members = [
    "core/crates/*",
    "host-win/crates/*",
    "tools/hello",
    "tools/diag-win",
    "tools/pen-inject/core",
    "tools/pen-inject/harness",
    "tools/pen-inject/inject",
    "tools/bench/transport",
    "tools/bench/video-pc",
    "tools/vdd-probe",
    "tools/stroke-spike",
    "tools/stroke-spike/native",
    "tools/ai-spike",
    "tools/pair-cli",
    "mcp/native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-VisualWorkbench-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 1
incremental = false
