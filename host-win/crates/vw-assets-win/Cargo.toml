[package]
name = "vw-assets-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
vw-stream = { path = "../../../core/crates/vw-stream", version = "=0.1.0" }
vw-assets = { path = "../../../core/crates/vw-assets", version = "=0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
blake3 = { workspace = true, features = ["std", "pure"] }
ring.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
vw-raster = { path = "../../../core/crates/vw-raster", version = "=0.1.0" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes"] }

[dev-dependencies]
png.workspace = true

[[bin]]
name = "vw-pyramid-helper"
path = "src/bin/helper.rs"

[lints]
workspace = true
