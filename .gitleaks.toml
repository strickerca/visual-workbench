title = "Visual Workbench secrets and evidence identifiers"

[extend]
useDefault = true

[[allowlists]]
description = "Generated build output and preserved input packages are not source"
paths = ['''(^|/)(target|build|build-hil|\.gradle|\.kotlin|\.local|\.git|\.claude/worktrees|fixtures-private|generated)/''']

[[allowlists]]
description = "Exact public nodejs/release-keys Git commit, independently verified on the publisher repository"
condition = "AND"
# dir mode skips whole files for path-only matching; targetRules forces per-finding AND.
targetRules = ["generic-api-key"]
paths = ['''(^|/)tools/licenses/node-runtime\.json$''']
regexTarget = "line"
regexes = ['''^\s*"release_keys_commit": "481637f813e912c4aa3622d7964ab426c97b8e8d",?\s*$''']

[[rules]]
id = "vw-repo-user-profile"
description = "A real user profile name must not be committed anywhere in this public repository"
regex = '''(?i)(?:[A-Za-z]:(?:\\{1,2}|/)Users(?:\\{1,2}|/)|/(?:home|Users)/)[A-Za-z0-9._-]+'''

[[rules.allowlists]]
description = "Only redacted, synthetic or well-known machine accounts are allowed"
regexTarget = "match"
regexes = ['''(?i)[\\/](?:redacted|synthetic-user|example-user|owner|other|public|default|runner|user|root|name|you|me)$''']

[[rules]]
id = "vw-mcp-token"
description = "Reserved token rule; the final format is defined in T2.09"
regex = '''\bvw_mcp_[A-Za-z0-9_-]{32,}\b'''

[[allowlists]]
description = "Exact reviewed lines in the licence-audit tool that pair file names with SHA-256 digests; not credentials"
condition = "AND"
paths = ['''(^|/)tools/assisted\-selection/license\-audit/audit\.py$''']
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''^\s*"tokenizers\-0\.23\.3\.tar\.gz": "cded33237c77caeef62944d32aa9a7ef42bdce2b3497e18d137e072a8c4be438",?\s*$''',
]
